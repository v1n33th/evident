<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in - Acme</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body data-page="signin">
<main>
<h1>Sign in</h1>
<form id="auth-form">
<input id="email" type="email" placeholder="Email" aria-label="Email" required>
<input id="password" type="password" placeholder="Password" aria-label="Password" required>
<button id="submit" type="submit">Sign in</button>
</form>
<p><a href="/signup">New here? Sign up</a></p>
<p id="toast" role="status"></p>
</main>
<script src="/static/app.js"></script>
</body>
</html>
