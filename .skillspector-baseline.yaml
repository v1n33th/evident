# SkillSpector false positives, each checked against its line (2026-11-05).
# Scan each skill with it: for s in skills/*/; do skillspector scan "$s" --baseline .skillspector-baseline.yaml; done
version: 2
rules:
  - id: "AR2"
    path: "*CHECK.md"
    message: "Never judge"
    reason: "Checker scope (compare the picture with the note, not the app with the spec); strips no warning."
  - id: "PE3"
    path: "scripts/build-proof.mjs"
    reason: "Matches approvedBy fields; the only credential text is the redaction pattern that hides AWS keys in evidence."
  - id: "PE3"
    path: "scripts/report.mjs"
    reason: "Matches approvedBy fields; the only credential text is the redaction pattern that hides AWS keys in evidence."
  - id: "TM1"
    path: "*SKILL.md"
    message: "git reset --hard"
    reason: "The match is the skill's own ban: never git reset --hard."
  - id: "E1"
    path: "*curl.md"
    reason: "curl calls the app under test at the user's own App URL."
  - id: "E1"
    path: "*targets/api.md"
    reason: "curl calls the app under test at the user's own App URL."
  - id: "TP4"
    reason: "The LLM judges one helper script (decisions.mjs, guard.mjs) against the whole skill's description."
  - id: "LP3"
    path: "SKILL.md"
    reason: "allowed-tools grants tools without asking in Claude Code; it is no ceiling, and the scanner itself says not to add it to silence this. The agent's own permission settings apply."
  - id: "SQP-1"
    path: "SKILL.md"
    reason: "\"explore\" is scoped to \"a feature in the running app (web, API, or a target you define)\"; it is how users ask for a bug bash."
  - id: "SQP-3"
    path: "scripts/report.mjs"
    reason: "The page is English, so its dates are too; zone() reads the time zone from the en-GB string."
  - id: "EA2"
    reason: "Auto mode is opt-in, never pushes, deploys or migrates, and records every ruling in decisions.md."
